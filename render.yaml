services:
  - type: web
    name: ai-document-compliance-rag
    runtime: python
    plan: free
    rootDir: p2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.rag.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: GOOGLE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://ai-document-compliance-rag.vercel.app
